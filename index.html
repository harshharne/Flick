<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work in progress</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg: #f2f1ee; --fg: #23211f; --muted: #6f6a64; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1a19; --fg: #ecebe8; --muted: #9a958e; } }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: "Helvetica Neue", Arial, sans-serif;
      display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    }
    main { max-width: 32rem; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; margin: 0 0 0.75rem; }
    p { margin: 0; color: var(--muted); font-size: 1.0625rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Work in progress</h1>
    <p>This project is being rebuilt. Check back soon.</p>
  </main>
</body>
</html>
